name: Test and portable desktop releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unit and simulated session tests
        shell: pwsh
        run: ./scripts/test.ps1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dev-only loopback SSH fixture
        shell: pwsh
        run: python -m pip install paramiko==4.0.0
      - name: Actual two-hop SSH.NET protocol smoke
        shell: pwsh
        run: ./tests/integration/run-protocol-smoke.ps1
      - name: Build ZIP, extract and launch Windows desktop
        shell: pwsh
        run: ./scripts/build-portable.ps1 -Version 1.0.0 -RuntimeIdentifier win-x64 -SkipTests -SkipBenchmark
      - name: Verify SSH and device credentials with the published runtime
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/v1.0.0/manifest-win-x64.json -Raw | ConvertFrom-Json
          ./tests/integration/run-protocol-smoke.ps1 -PublishedDirectory $manifest.smoke.Extracted -OutputDirectory artifacts/ssh-protocol-portable
      - name: Retain test and desktop evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-commit-tests
          path: |
            artifacts/test-results
            artifacts/ssh-protocol
            artifacts/ssh-protocol-portable/*.json
            artifacts/ssh-protocol-portable/*.txt
            artifacts/v*/smoke-*/evidence
          if-no-files-found: warn

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Native build, extract, Demo smoke and performance capture
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TARGET_RID: ${{ matrix.rid }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          $version = if ($env:RELEASE_IS_TAG -eq 'true') { $env:RELEASE_REF } else { '1.0.0' }
          $credentials = @('MACOS_CERTIFICATE_BASE64','MACOS_CERTIFICATE_PASSWORD','MACOS_SIGNING_IDENTITY','APPLE_ID','APPLE_TEAM_ID','APPLE_APP_SPECIFIC_PASSWORD')
          $present = @($credentials | Where-Object { [Environment]::GetEnvironmentVariable($_) }).Count
          if ($IsMacOS -and $present -gt 0 -and $present -lt $credentials.Count) { throw 'Partial macOS signing credentials: configure all six secrets, or none for an explicitly unsigned test build.' }
          $sign = $IsMacOS -and $present -eq $credentials.Count
          ./scripts/build-portable.ps1 -Version $version -RuntimeIdentifier $env:TARGET_RID -SkipTests -SignMac:$sign
          New-Item -ItemType Directory -Path release-upload | Out-Null
          $releaseDirectory = Join-Path artifacts ('v' + $version.TrimStart('v'))
          $zip = @(Get-ChildItem -LiteralPath $releaseDirectory -File -Filter "HPCPeek-v$($version.TrimStart('v'))-$($env:TARGET_RID)-portable*.zip")
          if ($zip.Count -ne 1) { throw 'Expected exactly one native architecture ZIP.' }
          Copy-Item -LiteralPath $zip[0].FullName -Destination release-upload
      - name: Retain architecture ZIP
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: release-upload/*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Retain native layout, signature and performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.rid }}
          path: |
            artifacts/v*/size-*.json
            artifacts/v*/structure-*.json
            artifacts/v*/pruning-*.json
            artifacts/v*/manifest-*.json
            artifacts/v*/smoke-*/evidence
            artifacts/v*/benchmark-*/benchmark-result.json
            artifacts/v*/staging-*/package/signing-result.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Upload and verify three ZIPs plus SHA-256 in Release Assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -AssetDirectory release-assets
